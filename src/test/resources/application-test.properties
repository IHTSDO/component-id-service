# ? Use Testcontainers JDBC URL or in-memory placeholder (overridden by TestContainer setup)
spring.datasource.url=jdbc:tc:mysql:8.0.36:///testdb
spring.datasource.username=test
spring.datasource.password=test

# ? JPA & Hibernate configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ? Reduce logging
logging.level.org.springframework=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR
logging.level.org.snomed.cis=ERROR

# ? Disable external calls
crowd.url=
crowd.application=
crowd.password=

ims.urls.base=http://localhost:8080/ims
ims.urls.login=/authenticate
ims.urls.logout=/account/logout
ims.urls.authenticate=/account
ims.cookiename=test-token

# ? Disable cloud dependencies
spring.cloud.consul.enabled=false
spring.cloud.vault.enabled=false

# ? Web config (optional if using WebMvcTest)
server.servlet.context-path=/api
server.port=0
